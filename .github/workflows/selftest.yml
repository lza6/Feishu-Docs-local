name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 起全局 WebSocket 稳定，lib/cdp.mjs 会在 Node 20 上主动报错，故不再覆盖 20
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 零依赖：不跑 npm install，直接执行
      - name: 纯逻辑自检（不需要浏览器/网络）
        run: node selftest.mjs

      - name: 缺陷回归用例（render / capture / 本地服务契约）
        run: node --test

      - name: CLI 冒烟（--help 必须正常退出）
        run: node feishu-export.mjs --help

      - name: CLI 参数校验（缺值必须以 2 退出）
        run: |
          node feishu-export.mjs --out && exit 1 || test $? -eq 2
